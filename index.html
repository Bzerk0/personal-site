<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hudson's Arcade | Hudson Bjerkness</title>
  <meta name="description" content="The portfolio of Hudson Bjerkness: one arcade cabinet in the dark. Step up to the screen to pick a project.">
  <!--head-->
  <link rel="stylesheet" href="/src/styles/arcade.css">
  <!-- Marks that JavaScript is on, before anything is drawn. Without it, the page is the plain 2D landing. -->
  <script>document.documentElement.classList.add('js')</script>
</head>
<body class="arcade">
  <!--nav-->

  <!-- The 3D scene is drawn here. -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Black cover that fades away once the 3D scene is ready -->
  <div id="cover" class="cover"></div>

  <!-- Text shown on top of the 3D scene -->
  <div class="hud">

    <!-- The project carousel. The projects themselves are drawn on the cabinet's 3D screen (src/scene/screenDisplay.js);
         these are the real controls laid over it: an arrow either side of the screen, and the screen itself as a link.
         src/scene/arcade.js lines them up with the screen and fills in the link for the project showing. -->
    <div id="menu" class="carousel" role="group" aria-roledescription="carousel" aria-label="Projects" hidden>
      <button id="prev" class="carousel__arrow carousel__arrow--prev" type="button" aria-label="Previous project"><span></span></button>
      <a id="screen-link" class="carousel__screen" href="/portfolio/"></a>
      <button id="next" class="carousel__arrow carousel__arrow--next" type="button" aria-label="Next project"><span></span></button>
      <p id="menu-status" class="sr-only" aria-live="polite"></p>
      <p class="carousel__keys">
        <span class="for-mouse"><kbd>←</kbd><kbd>→</kbd> browse</span>
        <span class="for-mouse"><kbd>Enter</kbd> play</span>
        <span class="for-mouse"><kbd>Esc</kbd> back</span>
        <span class="for-touch">Swipe to browse</span>
      </p>
    </div>

    <!-- The cabinet model's license (CC BY 4.0) asks for this credit. -->
    <p class="hud__credit">Cabinet based on <a href="https://sketchfab.com/3d-models/defender-arcade-9e656531a0ea4b6595d2337a4006a552">“Defender Arcade”</a> by <a href="https://sketchfab.com/delinx">Delinx</a>, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, repainted</p>
  </div>

  <!-- Full-screen glow used during transitions -->
  <div id="flash" class="flash" aria-hidden="true"></div>

  <!-- The same content as plain HTML. Screen readers always get it, and it becomes the whole page
       (the "2D landing") when 3D can't run. -->
  <main id="main" class="wrap landing">
    <h1 class="neon-sign"><span>Hudson’s</span> <span>Arcade</span></h1>
    <p class="lede">The portfolio of Hudson Bjerkness. Every cabinet in the arcade is a project: pick one to see what it is and what I did.</p>
    <!--project-grid-->
    <p class="landing__more">
      <a class="button" href="/about/">About Hudson</a>
      <a class="button button--ghost" href="/contact/">Contact</a>
    </p>
  </main>
  <!--footer-->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
